services:
  arbiter:
    build:
      context: .
      dockerfile: arbiter/Dockerfile
    container_name: triseal_arbiter
    runtime: ${CHAMBER_RUNTIME:-runsc}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODE=triseal
      - CHAMBER_RUNTIME=${CHAMBER_RUNTIME:-runsc}
      - BLUE_URL=http://blue:8001
      - LLM_URL=http://llm:8002
      - REPLY_DEADLINE_MS=${REPLY_DEADLINE_MS:-1400}
      - LEDGER_DIR=/tmp/data
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/keys:/app/data/keys:ro
    networks:
      net_red:
        ipv4_address: 172.28.1.10
      net_blue:
        ipv4_address: 172.28.2.10
      net_llm:
        ipv4_address: 172.28.3.10
      net_admin:
        ipv4_address: 172.28.4.10
    extra_hosts:
      - "red:172.28.1.20"
      - "blue:172.28.2.20"
      - "llm:172.28.3.20"

  blue:
    build:
      context: .
      dockerfile: chambers/blue/Dockerfile
    container_name: triseal_blue
    runtime: ${CHAMBER_RUNTIME:-runsc}
    environment:
      - MODE=triseal
      - CHAMBER_RUNTIME=${CHAMBER_RUNTIME:-runsc}
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp
    networks:
      net_blue:
        ipv4_address: 172.28.2.20
    extra_hosts:
      - "arbiter:172.28.2.10"

  llm:
    build:
      context: .
      dockerfile: chambers/llm/Dockerfile
    container_name: triseal_llm
    runtime: ${CHAMBER_RUNTIME:-runsc}
    environment:
      - MODE=triseal
      - CHAMBER_RUNTIME=${CHAMBER_RUNTIME:-runsc}
      - MODEL_PATH=/models/model.gguf
    volumes:
      - ./chambers/llm/models/model.gguf:/models/model.gguf:ro
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp
    networks:
      net_llm:
        ipv4_address: 172.28.3.20
    extra_hosts:
      - "arbiter:172.28.3.10"

  red:
    build:
      context: .
      dockerfile: chambers/red/Dockerfile
    container_name: triseal_red
    runtime: ${CHAMBER_RUNTIME:-runsc}
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - MODE=triseal
      - CHAMBER_RUNTIME=${CHAMBER_RUNTIME:-runsc}
      - ARBITER_URL=http://arbiter:8000
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp
    networks:
      net_red:
        ipv4_address: 172.28.1.20
    extra_hosts:
      - "arbiter:172.28.1.10"

networks:
  net_red:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24
  net_blue:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.2.0/24
  net_llm:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.3.0/24
  net_admin:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.4.0/24
