services:
  arbiter:
    build:
      context: .
      dockerfile: arbiter/Dockerfile
    container_name: triseal_baseline_arbiter
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODE=baseline
      - BLUE_URL=http://blue:8001
      - LLM_URL=http://llm:8002
      - REPLY_DEADLINE_MS=0
      - LEDGER_DIR=/tmp/data
    networks:
      - net_shared

  blue:
    build:
      context: .
      dockerfile: chambers/blue/Dockerfile
    container_name: triseal_baseline_blue
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MODE=baseline
    networks:
      - net_shared

  llm:
    build:
      context: .
      dockerfile: chambers/llm/Dockerfile
    container_name: triseal_baseline_llm
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - MODE=baseline
    networks:
      - net_shared

  red:
    build:
      context: .
      dockerfile: chambers/red/Dockerfile
    container_name: triseal_baseline_red
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - MODE=baseline
      - ARBITER_URL=http://arbiter:8000
    networks:
      - net_shared

networks:
  net_shared:
    driver: bridge
